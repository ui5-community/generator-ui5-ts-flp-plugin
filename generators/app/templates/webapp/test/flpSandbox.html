<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= namespace %> - FLP Sandbox</title>
    <script src="flpSandbox.config.js"></script>
    <script
      src="../test-resources/sap/ushell/bootstrap/sandbox.js"
      id="sap-ushell-bootstrap"
    ></script>
    <script
      id="sap-ui-bootstrap"
      src="../resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m,sap.ui.core,sap.f,sap.ushell"
      data-sap-ui-async="true"
      data-sap-ui-preload="async"
      data-sap-ui-theme="<%= defaultTheme %>"
      data-sap-ui-language="en"<% if (gte1_120_0) { %>
      data-sap-ui-compat-version="edge"
      data-sap-ui-resource-roots='{
        "<%= pluginId %>": "../"
      }'
      data-sap-ui-frame-options="allow"
      data-sap-ui-flexibility-services='[{"connector": "LocalStorageConnector"}]'
      data-sap-ui-on-init="module:<%= pluginURI %>/test/flpSandbox"<% } else { %>
      data-sap-ui-compatVersion="edge"
      data-sap-ui-resourceroots='{
        "<%= pluginId %>": "../"
      }'
      data-sap-ui-frameOptions="allow"
      data-sap-ui-flexibilityServices='[{"connector": "LocalStorageConnector"}]'
      data-sap-ui-oninit="module:<%= pluginURI %>/test/flpSandbox"<% } %>
    ></script>
  </head>
  <body class="sapUiBody" id="content"></body>
</html>
